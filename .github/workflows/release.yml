# Builds the installers for macOS (Apple silicon and Intel), Linux and Windows.
#
# - Pushing a tag like v0.2.0 builds everything and attaches it to a DRAFT GitHub release named
#   after the tag. Review the draft, then publish it by hand.
# - Running it by hand (Actions > release > Run workflow) builds the same installers and keeps
#   them as workflow artifacts for 14 days, without creating a release.
#
# See "Releasing" in README.md.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    # A tag must match the version in Cargo.toml and package.json, so installers are never
    # published under the wrong number.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions agree
        run: python3 tools/set-version.py --check ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci

      - name: Build and attach to the draft release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Virgil ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          releaseBody: |
            ## Downloads

            | System | File |
            |---|---|
            | macOS, Apple silicon | `Virgil_*_aarch64.dmg` |
            | macOS, Intel | `Virgil_*_x64.dmg` |
            | Windows | `Virgil_*_x64-setup.exe` (or the `.msi`) |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            These builds are not signed yet. On macOS, open the app the first time with right-click > Open (or allow it under System Settings > Privacy & Security). On Windows, choose "More info" > "Run anyway".

      - name: Build only
        if: github.ref_type != 'tag'
        run: npm run tauri build -- --target ${{ matrix.target }}
      - name: Keep installers as workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: virgil-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
